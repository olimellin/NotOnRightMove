<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keep It Flowing | Bourn</title>
  <meta name="description" content="Keep It Flowing: a pipe puzzle about business finance that flows.">
  <meta name="theme-color" content="#06063A">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ===== Game screen ===== -->
  <section id="game" class="game" aria-label="Keep It Flowing" hidden>
    <header class="topbar">
      <div class="logo-slot" data-logo></div>
      <div class="level-title">
        <span id="hud-level-num">Level 1</span>
        <strong id="hud-level-name">Day one</strong>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" data-sound-toggle aria-pressed="false">
          <span class="sr-only" data-sound-label>Sound off</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="sound-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="sound-off" d="M16 9l6 6m0-6l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-pause">
          <span class="sr-only">Pause</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="hud">
      <div class="timer" id="hud-timer">
        <span class="timer-label" id="hud-timer-label">Water starts in</span>
        <span class="timer-value" id="hud-timer-value">20s</span>
      </div>
      <button type="button" class="btn btn-small" id="btn-flow-now">Start flow now</button>
      <div class="gauge" id="gauge" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Business gauge">
        <div class="gauge-head"><span>Your business</span><span id="gauge-status"></span></div>
        <div class="gauge-track">
          <div class="gauge-fill" id="gauge-fill"></div>
          <div id="gauge-markers"></div>
        </div>
      </div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <canvas id="board" tabindex="0" role="application"
        aria-label="Game board. Arrow keys move the cursor, R rotates, Enter places, Delete removes."></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <nav class="tray" id="tray" aria-label="Pipe tray"></nav>
    <div class="sr-only" id="sr-live" aria-live="polite"></div>
  </section>

  <!-- ===== Start ===== -->
  <section class="screen screen-start" data-screen="start" aria-labelledby="start-title">
    <div class="card card-dark start-card">
      <div class="logo-slot logo-lg" data-logo></div>
      <svg class="start-art" viewBox="0 0 320 90" aria-hidden="true">
        <path d="M10 30h90a25 25 0 0 1 25 25v0a25 25 0 0 0 25 25h160" fill="none" stroke="#DCD6FF" stroke-opacity=".9" stroke-width="18"/>
        <path d="M10 30h90a25 25 0 0 1 25 25v0a25 25 0 0 0 25 25h160" fill="none" stroke="#28CCFF" stroke-width="8" class="start-flow"/>
      </svg>
      <h1 id="start-title" data-copy="title">Keep It Flowing</h1>
      <p class="tagline" data-copy="tagline"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-play">Play</button>
        <button type="button" class="btn btn-ghost" id="btn-howto">How to play</button>
      </div>
      <button type="button" class="text-btn" data-sound-toggle aria-pressed="false"><span data-sound-label>Sound off</span></button>
    </div>
  </section>

  <!-- ===== How to play ===== -->
  <section class="screen" data-screen="howto" aria-labelledby="howto-title" hidden>
    <div class="card card-light howto-card">
      <h2 id="howto-title">How to play</h2>
      <ol class="steps" id="howto-steps"></ol>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-howto-play">Play</button>
        <button type="button" class="btn btn-outline" data-goto="start">Back</button>
      </div>
    </div>
  </section>

  <!-- ===== Level intro ===== -->
  <section class="screen screen-overlay" data-screen="intro" aria-labelledby="intro-title" hidden>
    <div class="card card-light intro-card">
      <p class="eyebrow" id="intro-num">Level 1 of 5</p>
      <h2 id="intro-title">Day one</h2>
      <p class="lead" id="intro-line"></p>
      <p class="note" id="intro-new" hidden></p>
      <p class="hint" id="intro-hint"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-intro-go">Start level</button>
      </div>
    </div>
  </section>

  <!-- ===== Level complete ===== -->
  <section class="screen screen-overlay" data-screen="complete" aria-labelledby="complete-title" hidden>
    <div class="card card-light">
      <p class="eyebrow" id="complete-num"></p>
      <h2 id="complete-title">Level complete</h2>
      <div class="stars" id="complete-stars"></div>
      <dl class="breakdown" id="complete-breakdown"></dl>
      <p class="hint" id="complete-msg"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-next">Next level</button>
        <button type="button" class="btn btn-outline" id="btn-replay">Replay level</button>
      </div>
    </div>
  </section>

  <!-- ===== Game over ===== -->
  <section class="screen screen-overlay" data-screen="over" aria-labelledby="over-title" hidden>
    <div class="card card-light">
      <p class="eyebrow" id="over-num"></p>
      <h2 id="over-title">Flow stopped</h2>
      <p class="lead" id="over-reason"></p>
      <p class="note" id="over-tip" hidden></p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-retry">Retry</button>
        <button type="button" class="btn btn-outline" data-goto="start">Menu</button>
      </div>
    </div>
  </section>

  <!-- ===== Pause ===== -->
  <section class="screen screen-overlay" data-screen="pause" aria-labelledby="pause-title" hidden>
    <div class="card card-light">
      <h2 id="pause-title">Paused</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-resume">Resume</button>
        <button type="button" class="btn btn-outline" id="btn-restart">Restart level</button>
        <button type="button" class="btn btn-outline" data-goto="start">Menu</button>
      </div>
    </div>
  </section>

  <!-- ===== Final ===== -->
  <section class="screen" data-screen="final" aria-labelledby="final-title" hidden>
    <div class="card card-dark final-card">
      <div class="logo-slot" data-logo></div>
      <p class="eyebrow">All five stages done</p>
      <h2 id="final-title" class="final-score"><span id="final-score">0</span> <small>points</small></h2>
      <div class="stars stars-row" id="final-stars"></div>
      <p class="signoff" data-copy="signOff"></p>
      <a class="btn btn-primary btn-cta" id="cta-link" target="_blank" rel="noopener" data-copy="ctaButton"></a>

      <form class="lb-form" id="lb-form" novalidate>
        <h3>Save your score</h3>
        <label for="lb-name">Display name</label>
        <input id="lb-name" name="name" type="text" maxlength="20" autocomplete="nickname" required>
        <label for="lb-email">Get the Flow Check results <span class="optional">(optional email)</span></label>
        <input id="lb-email" name="email" type="email" maxlength="120" autocomplete="email">
        <label class="check"><input id="lb-consent" name="consent" type="checkbox"> <span>Yes, Bourn can email me my Flow Check results.</span></label>
        <p class="form-msg" id="lb-msg" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-secondary" id="lb-save">Save score</button>
      </form>

      <div class="lb">
        <h3>Leaderboard <span class="optional">(this device)</span></h3>
        <ol id="lb-list"></ol>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-again">Play again</button>
      </div>
      <p class="disclaimer" data-copy="disclaimer"></p>
    </div>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
